[package]
name = "memory-bee"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Read-only session inspection for portable agent context"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
ratatui = "0.30.2"
crossterm = "0.29"
portable-pty = "0.9.0"
vt100 = "0.16.2"
uuid = { version = "1", features = ["serde", "v4"] }
